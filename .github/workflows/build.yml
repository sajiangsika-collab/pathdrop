name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # macOS runner 排队可能很久，给足时间但别无限挂着
    timeout-minutes: 60
    env:
      # Windows runner 默认 cp1252，不加这个中文日志会抛 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          # 用 Intel 机器：GitHub 官方提示 macOS arm64 池子容量紧张（排队很久甚至抢不到），
          # 而 x86_64 产物在 Apple Silicon 上可经 Rosetta 2 运行，兼容面反而更广。
          # 注意 macos-13 已退役，Intel 标签现在只剩 macos-15-intel / macos-26-intel
          - os: macos-15-intel
            label: macOS x86_64
          - os: ubuntu-22.04
            label: Linux x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖（Linux 的 tkinter / X11）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev libx11-6 libxext6 libxrender1 libxft2

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: 生成图标
        run: python make_icon.py

      - name: 打包
        run: python build.py --package

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PathDrop-${{ runner.os }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

      - name: 发布到 Releases（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.tar.gz
          generate_release_notes: true
